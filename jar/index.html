<meta property="og:description" content="珍珠装在谜底形状的大罐子里，摆好杯就自己流下来，出完杯揭晓谜底，再拿谜底合成新饮品和门店装饰。3D 试玩版，24 关。">

<style>
:root{--pink:#ff6f91;--pink2:#e0457b;--mint:#4fc7a1;--mint2:#2f9e7a;--ink:#4a3048;--cream:#fff8f0;--sun:#ffc94d;--sun2:#e8a21a;--sky:#59b7ff;--sky2:#2f86d6;--grey:#b9b3c6;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe3cf;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;padding:0;background:none}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:120px;height:52px;padding:0 22px;border-radius:26px;font-size:19px;font-weight:800;color:#fff;background:var(--pink);box-shadow:0 5px 0 var(--pink2),0 9px 18px rgba(120,40,70,.25);transition:transform .08s,box-shadow .08s;letter-spacing:.5px;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink2),0 4px 10px rgba(120,40,70,.2)}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 var(--mint2),0 9px 18px rgba(30,110,80,.25)}
.btn.mint:active{box-shadow:0 1px 0 var(--mint2)}
.btn.sun{background:var(--sun);color:#6b4300;box-shadow:0 5px 0 var(--sun2),0 9px 18px rgba(150,100,10,.25)}
.btn.sun:active{box-shadow:0 1px 0 var(--sun2)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--sky2),0 9px 18px rgba(30,80,150,.25)}
.btn.sky:active{box-shadow:0 1px 0 var(--sky2)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e3d7e6,0 9px 18px rgba(80,40,80,.12)}
.btn.ghost:active{box-shadow:0 1px 0 #e3d7e6}
.btn.small{height:42px;min-width:0;font-size:16px;padding:0 16px;border-radius:21px}
.btn .ad{display:inline-flex;align-items:center;justify-content:center;width:26px;height:20px;border-radius:6px;background:rgba(255,255,255,.9);color:var(--pink2);font-size:11px;font-weight:900}
.btn.sun .ad{color:var(--sun2)}
.btn.mint .ad{color:var(--mint2)}
.btn.sky .ad{color:var(--sky2)}
.btn[disabled]{filter:grayscale(.8) brightness(1.05);opacity:.6;pointer-events:none}
/* ---------------- HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud .top{position:absolute;left:0;right:0;top:calc(var(--safeT) + 8px);display:flex;align-items:center;gap:8px;padding:0 10px}
.ib{pointer-events:auto;width:44px;height:44px;border-radius:15px;background:#fff;box-shadow:0 4px 0 #e6d6e2,0 6px 14px rgba(80,40,80,.15);display:flex;align-items:center;justify-content:center}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #e6d6e2}
.ib svg{width:24px;height:24px}
.title{flex:1;min-width:0;text-align:center;line-height:1.15}
#lvTitle{font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 #c2406a,2px 0 0 #c2406a,-2px 0 0 #c2406a,0 -2px 0 #c2406a,1.5px 1.5px 0 #c2406a,-1.5px 1.5px 0 #c2406a,1.5px -1.5px 0 #c2406a,-1.5px -1.5px 0 #c2406a,0 5px 8px rgba(120,30,70,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 4px}
#lvSub{margin-top:3px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#fff;background:rgba(90,50,80,.38);border-radius:10px;padding:2px 9px;white-space:nowrap}
.tag{border-radius:7px;padding:0 6px;font-size:11px;line-height:16px}
.tag.hard{background:#ff5c5c}.tag.relax{background:#4fc7a1}.tag.tutorial{background:#59b7ff}.tag.normal{background:rgba(255,255,255,.25)}
.coins{pointer-events:auto;display:flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 6px;border-radius:19px;background:rgba(255,255,255,.92);box-shadow:0 4px 0 #e6d6e2;font-weight:900;font-size:17px;min-width:76px}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c4 0 18%,#ffd34d 20% 62%,#e8a21a 64%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);flex:none}
#progWrap{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safeT) + 60px);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);border-radius:14px;padding:4px 12px 4px 6px;box-shadow:0 3px 0 rgba(0,0,0,.06);font-size:13px;font-weight:800;white-space:nowrap}
#progWrap .bar{width:84px;height:10px;border-radius:5px;background:#f1e3ec;overflow:hidden}
/* 状态栏里的谜底小标：问号 + 是食材还是道具；揭晓过变金色、写名字 */
.hid{pointer-events:auto;display:inline-flex;align-items:center;gap:4px;margin-left:2px;padding:2px 8px 2px 4px;border-radius:10px;background:#f1e3ec;color:#8a6d86;font-size:12px;font-weight:900;font-family:inherit;transition:background .3s}
.hid i{position:relative;width:15px;height:15px;border-radius:50%;background:#c9bdd0}
.hid i:after{content:"?";position:absolute;inset:0;color:#fff;font-size:10px;font-style:normal;line-height:15px;text-align:center}
.hid.got{background:linear-gradient(#ffe58a,#ffc94d);color:#7a4b00;animation:hidPop .5s}
.hid.got i{background:#fff}
.hid.got i:after{content:"★";color:#f2a20c;font-size:9px}
@keyframes hidPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (max-width:350px){#progWrap .bar{width:56px}#progWrap{padding-right:8px}}
#progWrap .bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ff8fab,#ff6f91);transition:width .3s}
#progWrap .cupico{width:18px;height:20px;border-radius:3px 3px 6px 6px;background:linear-gradient(#fff 0 25%,#c79a73 25%);border:2px solid #fff;box-shadow:0 0 0 1.5px #d9b8c8}
#hud .bottom{position:absolute;left:0;right:0;bottom:calc(var(--safeB) + 12px);display:flex;justify-content:center;gap:12px;padding:0 10px}
.tool{pointer-events:auto;position:relative;width:76px;height:72px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #e6d6e2,0 8px 16px rgba(80,40,80,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:900}
.tool:active{transform:translateY(4px);box-shadow:0 1px 0 #e6d6e2}
.tool svg{width:30px;height:30px}
.tool em{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;padding:0 6px;font-style:normal;font-size:13px;line-height:24px;color:#fff;background:var(--pink);box-shadow:0 2px 0 var(--pink2)}
.tool em.ad{background:var(--sky);box-shadow:0 2px 0 var(--sky2);font-size:10px}
.tool.on{background:#fff4c2;box-shadow:0 5px 0 #f0d77a,0 0 0 3px #ffc94d}
.tool.lit{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
#tip{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safeT) + 96px);width:max-content;max-width:min(92vw,420px);display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:8px 14px 8px 8px;box-shadow:0 4px 0 #f0dce6,0 8px 18px rgba(80,40,80,.15);font-size:15px;font-weight:700;line-height:1.35;animation:tipin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes tipin{from{transform:translate(-50%,-10px) scale(.8);opacity:0}}
.catface{flex:none;width:38px;height:38px;border-radius:50%;background:#ffb36b;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.catface:before,.catface:after{content:"";position:absolute;top:-6px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #ffb36b}
.catface:before{left:2px;transform:rotate(-18deg)}.catface:after{right:2px;transform:rotate(18deg)}
.catface i{position:absolute;top:14px;width:6px;height:8px;border-radius:3px;background:#3a2a2a}
.catface i:first-child{left:10px}.catface i:last-child{right:10px}
.catface b{position:absolute;left:12px;right:12px;bottom:6px;height:11px;border-radius:50%;background:#fff8f0}
#flipBar{position:absolute;left:50%;bottom:calc(var(--safeB) + 98px);transform:translateX(-50%);background:#ffc94d;color:#6b4300;font-weight:900;border-radius:16px;padding:8px 16px;box-shadow:0 4px 0 #e8a21a;font-size:15px;white-space:nowrap;pointer-events:auto}
#pointer{position:absolute;width:56px;height:56px;margin:-6px 0 0 -18px;pointer-events:none;z-index:30;animation:poke 0.9s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
@keyframes poke{50%{transform:translateY(12px) scale(.94)}}
#peek{position:absolute;pointer-events:none;transform:translate(-50%,-115%);background:#fff;border-radius:14px;padding:6px 12px;font-size:14px;font-weight:900;white-space:nowrap;box-shadow:0 4px 0 #e6d6e2,0 6px 16px rgba(0,0,0,.15);z-index:25}
#peek:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
#peek.bad{color:#b0405e}
/* ---------------- 首页 */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--safeT) + 40px) 20px calc(var(--safeB) + 34px);pointer-events:none}
.screen>*{pointer-events:auto}
#home{background:linear-gradient(180deg,rgba(255,240,230,.55),rgba(255,240,230,0) 45%,rgba(255,230,220,.0) 60%,rgba(255,225,215,.65))}
.logo{text-align:center;pointer-events:none}
.logo h1{margin:0;font-size:46px;font-weight:900;letter-spacing:2px;color:#fff;-webkit-text-stroke:2px #e0457b;text-shadow:0 5px 0 #e0457b,0 10px 18px rgba(160,40,80,.35);transform:rotate(-3deg)}
.logo p{margin:10px 0 0;font-size:15px;font-weight:800;color:#8a4566;background:rgba(255,255,255,.8);display:inline-block;padding:4px 14px;border-radius:12px}
.homeBtns{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.homeBtns .btn.big{min-width:230px;height:62px;font-size:23px;border-radius:31px}
.homeRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.homeRow .btn.small{padding:0 13px}
.btn.dot:before{content:"";position:absolute;top:-3px;right:-3px;width:13px;height:13px;border-radius:50%;background:#ff4d6d;border:2px solid #fff}
/* ---------------- 谜底卡、成品卡 */
.itemcard,.prodcard{position:relative;display:inline-block;margin:4px auto 0;padding:8px;border-radius:20px;background:radial-gradient(circle at 50% 50%,#fffaf0 0,#fff1d2 60%,#ffe2a8 100%);box-shadow:0 4px 0 #ecc77a,0 8px 18px rgba(200,140,20,.22)}
.itemcard img,.prodcard img{display:block;width:min(34vw,128px);height:auto;aspect-ratio:1/1}
.itemcard.ghost,.prodcard.ghost{background:#efe9f2;box-shadow:0 4px 0 #ddd3e3}
.itemcard .ribbon,.prodcard .ribbon{position:absolute;top:-9px;right:-14px;font-style:normal;font-size:12px;font-weight:900;color:#fff;background:var(--pink);border-radius:10px;padding:3px 9px;transform:rotate(8deg);box-shadow:0 3px 0 var(--pink2)}
.card.reward .prodcard{animation:prodIn .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes prodIn{0%{transform:scale(.2) rotate(-25deg)}100%{transform:none}}
.pname{font-size:18px;font-weight:900;color:var(--ink);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.kind{font-size:11px;font-weight:900;color:#fff;background:var(--mint);border-radius:7px;padding:1px 6px;line-height:16px}
.kind.decor{background:var(--sky)}.kind.recipe{background:var(--pink)}
.card p.ready{margin:8px 0 2px;padding:7px 10px;border-radius:12px;background:#fff4c2;color:#7a4b00;font-weight:900;font-size:14px}
.card p.goal{margin-top:6px}
/* ---------------- 合成台 */
.card.wide{width:min(100%,420px)}
.benchWrap{position:sticky;top:-22px;z-index:3;margin:0 -6px;padding:0 6px 2px;background:var(--cream)}
.bench{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#fff;border-radius:18px;padding:10px;box-shadow:0 3px 0 #f0dce6}
.bench.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.slots{display:flex;align-items:center;gap:3px}
.slots i{font-style:normal;font-weight:900;color:#c9b8c6;font-size:14px}
.slot{width:48px;height:48px;border-radius:14px;background:#f6eef3;border:2px dashed #e2cfdc;display:flex;align-items:center;justify-content:center;padding:2px}
.slot.on{background:#fff6dc;border:2px solid #ffc94d;animation:pop .25s}
.slot img{width:100%;height:100%}
.bench .btn{min-width:84px;height:46px}
.benchNote{margin:6px 0 0!important}.benchNote.ok{color:var(--mint2)!important;font-weight:900!important}
h3.sub{margin:14px 0 8px;font-size:15px;font-weight:900;display:flex;align-items:center;text-align:left}
h3.sub em{font-style:normal;font-size:12px;color:#9a8597;margin-left:auto}
.pc.it{flex-direction:column;gap:1px;aspect-ratio:auto;padding:5px 2px 4px}
.pc.it img{width:84%;max-width:56px;aspect-ratio:1/1;height:auto}
.pc.it span{font-size:10px;font-weight:800;color:#8a6d86;white-space:nowrap;line-height:1.2}
.pc.it.on{background:#fff4c2;box-shadow:0 4px 0 #f0d77a,0 0 0 2px #ffc94d}
.pc.it.lock{background:#f3eef5;box-shadow:0 4px 0 #e5dce8}
.pc.it.lock span{color:#b6a9bb}
.pc.it.can{box-shadow:0 4px 0 #f0d77a,0 0 0 2px #ffc94d}
.book{display:flex;flex-direction:column;gap:8px}
.rc{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 #f0dce6;text-align:left}
.rc .th{width:48px;height:48px;flex:none}
.rc .txt{flex:1;min-width:0}
.rc .txt b{display:flex;align-items:center;gap:5px;font-size:15px}
.rc.can{background:#fffbea;box-shadow:0 3px 0 #f0d77a,0 0 0 2px #ffd76a}
.rc.done{opacity:.8}
.needs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-top:3px}
.needs i{font-style:normal;font-size:11px;color:#c9b8c6;font-weight:900}
.ni{display:inline-flex;flex-direction:column;align-items:center;width:34px}
.ni img{width:26px;height:26px}
.ni em{font-style:normal;font-size:9px;font-weight:800;color:#8a6d86;white-space:nowrap;line-height:1.1}
.ni.miss em{color:#c0b3c4}
.needs.big{justify-content:center;margin:8px 0 2px}.needs.big .ni{width:52px}.needs.big .ni img{width:40px;height:40px}.needs.big .ni em{font-size:11px}
.rc .done,.rc .lack{flex:none;font-size:12px;font-weight:900;color:#9a8597}
.rc .done{color:var(--mint2)}
.rc .btn.small{height:36px;padding:0 12px;font-size:14px}
/* ---------------- 图鉴 */
.tabs{display:flex;margin:4px 0 10px}
.tabs button{flex:1;padding:6px 2px;font-size:12px}
.cxgrid{grid-template-columns:repeat(4,1fr)}
.pc.prod img{max-width:64px}
.lv .lvit{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:7px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);padding:1px}
.shopItem img.ico{width:48px;height:48px;padding:2px;background:#fff7f9}
.shopItem.lock{opacity:.7}
.shopItem .txt b{display:flex;align-items:center;gap:5px}
.mask.low{align-items:flex-end;background:rgba(60,30,55,.16)}
.mask.low .card{max-height:56%;margin-bottom:calc(var(--safeB) + 4px)}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pc{position:relative;aspect-ratio:1/1;border-radius:14px;background:#fff;box-shadow:0 4px 0 #ecd9e3;display:flex;align-items:center;justify-content:center;padding:4px;overflow:visible}
.pc img{display:block;max-width:100%;max-height:100%;border-radius:8px}
.pc b{position:absolute;left:-4px;top:-6px;font-size:10px;line-height:16px;min-width:16px;padding:0 4px;border-radius:8px;background:#fff;color:#9a8597;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chapter h3 em{font-style:normal;font-size:12px;color:#9a8597;margin-left:auto}
/* ---------------- 弹窗 */
.mask{position:absolute;inset:0;background:rgba(60,30,55,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.card{width:min(100%,380px);max-height:calc(100% - 24px);overflow:auto;background:var(--cream);border-radius:28px;padding:22px 20px 20px;text-align:center;box-shadow:0 10px 0 #f0d6c8,0 24px 50px rgba(60,20,50,.35);animation:pop .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card h2{margin:0 0 6px;font-size:25px;font-weight:900;color:var(--pink2)}
.card p{margin:6px 0;font-size:15px;line-height:1.55;font-weight:600;color:#6b5068}
.card .big{font-size:42px;font-weight:900;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.card .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.card .col{display:flex;flex-direction:column;gap:12px;align-items:stretch;margin-top:16px}
.card .note{font-size:12px;color:#9a8597;margin-top:12px;font-weight:600}
.stats{display:flex;justify-content:center;gap:10px;margin:10px 0 4px}
.stat{background:#fff;border-radius:14px;padding:8px 10px;min-width:74px;box-shadow:0 3px 0 #f0dce6}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:12px;font-weight:700;color:#9a8597}
.chapter{text-align:left;margin:14px 0 4px}
.chapter h3{margin:0 0 8px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.chapter h3 span{font-size:12px;color:#fff;background:var(--mint);border-radius:8px;padding:1px 8px}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{height:48px;border-radius:14px;background:#fff;font-weight:900;font-size:18px;box-shadow:0 4px 0 #ecd9e3;position:relative}
.lv.done{background:#d8f5e8;box-shadow:0 4px 0 #a9e2c8}
.lv.cur{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink2)}
.lv.lock{background:#efe9f1;color:#c2b8c8;box-shadow:0 4px 0 #e0d6e3}
.lv.hard:after{content:"难";position:absolute;top:-6px;right:-4px;font-size:10px;background:#ff5c5c;color:#fff;border-radius:6px;padding:0 4px;line-height:15px}
.lv.relax:after{content:"爽";position:absolute;top:-6px;right:-4px;font-size:10px;background:#4fc7a1;color:#fff;border-radius:6px;padding:0 4px;line-height:15px}
.shopItem{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:0 3px 0 #f0dce6;text-align:left}
.shopItem .ico{width:44px;height:44px;border-radius:12px;background:#ffeef3;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.shopItem .txt{flex:1;min-width:0}
.shopItem .txt b{display:block;font-size:16px}
.shopItem .txt span{font-size:12px;color:#9a8597;font-weight:600}
.setRow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:800;box-shadow:0 3px 0 #f0dce6}
.setRow>span{white-space:nowrap}
.sw{width:52px;height:30px;border-radius:15px;background:#e3d9e6;position:relative;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--mint)}.sw.on:after{left:25px}
.seg{display:flex;gap:4px;background:#f1e8f2;border-radius:12px;padding:3px}
.seg button{padding:5px 10px;border-radius:9px;font-weight:800;font-size:13px;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 2px 0 #e3d7e6}
/* ---------------- 模拟广告 */
#ad{position:absolute;inset:0;z-index:60;background:linear-gradient(160deg,#2b2350,#4b2d6e);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#ad .adTag{position:absolute;top:calc(var(--safeT) + 14px);left:14px;font-size:12px;font-weight:800;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:10px}
#ad .adX{position:absolute;top:calc(var(--safeT) + 10px);right:12px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;font-size:22px;font-weight:900}
#ad h3{margin:0;font-size:24px}
#ad .ring{width:110px;height:110px;border-radius:50%;border:8px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;position:relative}
#ad p{margin:0;opacity:.85;font-weight:600;line-height:1.5}
#ad.inter{background:linear-gradient(160deg,#18304a,#205a6e)}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#toast div{background:rgba(60,30,55,.88);color:#fff;font-weight:800;font-size:15px;padding:9px 16px;border-radius:16px;animation:toast 1.8s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.flycoin{position:absolute;width:26px;height:26px;z-index:65;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#ffe3cf;z-index:80;font-weight:900;color:#e0457b;font-size:20px;flex-direction:column;gap:12px}
#loading .dots{display:flex;gap:8px}
#loading .dots i{width:16px;height:16px;border-radius:50%;background:#5a3322;animation:bob .9s ease-in-out infinite}
#loading .dots i:nth-child(2){animation-delay:.15s;background:#9b6cf0}#loading .dots i:nth-child(3){animation-delay:.3s;background:#ff4f6d}
@keyframes bob{50%{transform:translateY(-10px)}}
#nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:800;line-height:1.6;background:#ffe3cf;z-index:90}
@media (min-width:700px) and (min-height:600px){#hud .top{max-width:760px;margin:0 auto}}
@media (max-height:620px){.tool{height:60px;width:66px}.tool svg{width:24px;height:24px}#progWrap{top:calc(var(--safeT) + 54px)}#tip{top:calc(var(--safeT) + 86px);font-size:13px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" tabindex="0"></canvas>
  <div id="hud" class="hidden">
    <div class="top">
      <button class="ib" id="btnMenu" aria-label="菜单"><svg viewBox="0 0 24 24" fill="none" stroke="#e0457b" stroke-width="3" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
      <div class="title"><div id="lvTitle">第 1 关</div><div id="lvSub"></div></div>
      <div class="coins" id="coinBox"><span class="coin"></span><b id="coinN">0</b></div>
    </div>
    <div id="progWrap"><span class="cupico"></span><div class="bar"><i id="progBar"></i></div><span id="progTxt">0/0</span><button id="hidChip" class="hid hidden" aria-label="本关谜底"><i></i><b id="hidTxt"></b></button></div>
    <div id="tip" class="hidden"><span class="catface"><i></i><b></b><i></i></span><span id="tipTxt"></span></div>
    <div id="flipBar" class="hidden">点罐底的 ＋ 选位置 · 再点一次确认</div>
    <div class="bottom">
      <button class="tool" id="btnOutlet"><svg viewBox="0 0 32 32" fill="none" stroke="#9b6cf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h16l-5 9v5h-6v-5z" fill="#efe6ff"/><path d="M13 23v4"/><path d="M25 17v10M20 22h10"/></svg><span>加出口</span><em id="outletN">1</em></button>
      <button class="tool" id="btnHint"><svg viewBox="0 0 32 32" fill="none" stroke="#e8a21a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4a8 8 0 0 0-5 14.3V22h10v-3.7A8 8 0 0 0 16 4z" fill="#fff4c2"/><path d="M12 26h8M14 29h4"/></svg><span>提示</span><em id="hintN">3</em></button>
      <button class="tool" id="btnRestart"><svg viewBox="0 0 32 32" fill="none" stroke="#4fc7a1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16a9 9 0 1 0 3-6.7"/><path d="M7 5v6h6"/></svg><span>重开</span></button>
    </div>
  </div>
  <div id="home" class="screen hidden">
    <div class="logo"><h1>波波奶茶站</h1><p>摆好杯 · 珍珠自己流 · 出完揭晓谜底</p></div>
    <div class="homeBtns">
      <button class="btn big" id="btnPlay">开始第 1 关</button>
      <div class="homeRow">
        <button class="btn sky small" id="btnLevels">关卡</button>
        <button class="btn sun small" id="btnCraft">合成</button>
        <button class="btn mint small" id="btnCodex">图鉴</button>
        <button class="btn mint small" id="btnStore">门店</button>
        <button class="btn ghost small" id="btnSettings">设置</button>
      </div>
    </div>
  </div>
  <div id="pointer" class="hidden"><svg viewBox="0 0 64 64"><path d="M24 30V10a5 5 0 0 1 10 0v16l12 3.5a6 6 0 0 1 4.2 7l-2.6 13A8 8 0 0 1 39.8 56H30a8 8 0 0 1-6.4-3.2L13 38.5a4.5 4.5 0 0 1 6.6-6.1z" fill="#fff" stroke="#4a3048" stroke-width="3.5" stroke-linejoin="round"/></svg></div>
  <div id="peek" class="hidden"></div>
  <div id="layer"></div>
  <div id="toast"></div>
  <div id="ad" class="hidden"><span class="adTag">模拟广告 · 不联网 · 不扣费</span><button class="adX" id="adX">✕</button><h3 id="adTitle">看完视频领取奖励</h3><div class="ring" id="adRing">3</div><p id="adText"></p><button class="btn mint hidden" id="adClaim">领取奖励</button></div>
  <div id="loading"><div class="dots"><i></i><i></i><i></i></div><div>奶茶店开门中…</div></div>
</div>
